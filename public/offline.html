<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · Biryani Point Batumi</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbf8f3;
        color: #17130f;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Noto Sans Georgian',
          sans-serif;
      }
      main {
        max-width: 460px;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #0a0a0a;
        border: 3px solid #e9a72d;
        color: #e9a72d;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 32px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 6px;
      }
      p {
        color: #6e685f;
        margin: 4px 0 18px;
        line-height: 1.5;
      }
      .alt {
        border-top: 1px solid #ece8e1;
        padding-top: 14px;
      }
      button,
      a.call {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        background: #e9a72d;
        color: #1a1208;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        margin: 4px;
      }
      a.call {
        background: #efebe4;
        color: #17130f;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">BP</div>
      <h1>You’re offline</h1>
      <p>Check your internet connection. Your order is saved on this device.</p>
      <div class="alt">
        <h1 lang="ka">ინტერნეტი არ არის</h1>
        <p lang="ka">შეამოწმეთ კავშირი. თქვენი შეკვეთა ამ მოწყობილობაზეა შენახული.</p>
        <h1 lang="ru">Нет подключения к интернету</h1>
        <p lang="ru">Проверьте соединение. Ваш заказ сохранён на этом устройстве.</p>
      </div>
      <button type="button" onclick="location.reload()">Try again · თავიდან ცდა · Ещё раз</button>
      <a class="call" href="tel:+995500904721">+995 500 90 47 21</a>
    </main>
  </body>
</html>
